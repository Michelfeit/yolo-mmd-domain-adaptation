[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dual-domain"
version = "0.1.0"
description = "MMD-based dual-domain feature alignment as a thin extension on top of stock ultralytics."
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.4",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dual_domain"]
