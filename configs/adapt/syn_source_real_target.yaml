# Dual-domain adaptation: source = synthetic (already pretrained, forward-only for MMD),
# target = real (gets the detection loss + is feature-aligned toward source).
# Simulates "source is small, target is large": source uses the same stride-subsampled
# anchor/ set the baseline checkpoint was pretrained on (see scripts/make_anchor_subset.py,
# configs/pretrain/syn_source.yaml); target uses the full dataset.

source:
  train: /media/chr65046/4TB-SSD/Syndrone/anchor/train
  val: /media/chr65046/4TB-SSD/Syndrone/anchor/val

target:
  train: /media/chr65046/4TB-SSD/VisDrone_20250110/train/labels_vehicle
  val: /media/chr65046/4TB-SSD/VisDrone_20250110/val/labels_vehicle

names: [vehicle]
