# Dual-domain adaptation: source = real_large (already pretrained on, forward-only
# for MMD, the anchor), target = syn_small (gets the detection loss + is
# feature-aligned toward source). Pair with the checkpoint from
# configs/pretrain/real_large.yaml.

source:
  train: /mnt/15TB-NVME/chr65046/datasets/real_large/images/train
  val: /mnt/15TB-NVME/chr65046/datasets/real_large/images/val

target:
  train: /mnt/15TB-NVME/chr65046/datasets/syn_small/images/train
  val: /mnt/15TB-NVME/chr65046/datasets/syn_small/images/val

names: [person, vehicle]
